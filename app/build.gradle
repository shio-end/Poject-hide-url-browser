plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.hideurl.browser'
    compileSdk 34
    sourceSets.main.res.srcDir rootProject.file("icons")

    defaultConfig {
        applicationId 'com.hideurl.browser'
        minSdk 31
        targetSdk 34
        versionCode 13
        versionName '0.9.2'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.10.0'
}
