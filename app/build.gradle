plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.hideurl.browser'
    compileSdk 34
    sourceSets.main.res.srcDir rootProject.file("icons")

    defaultConfig {
        applicationId 'com.hideurl.browser'
        minSdk 31
        targetSdk 34
        resValue 'string', 'google_web_client_id', providers.gradleProperty('VEIL_GOOGLE_WEB_CLIENT_ID').orElse('').get()
        versionCode 16
        versionName '0.10.2'
    }
}

dependencies {
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    implementation 'androidx.webkit:webkit:1.10.0'
}
